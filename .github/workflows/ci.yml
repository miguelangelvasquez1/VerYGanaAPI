name: CI

# Puerta de calidad de la API. Corre en cada PR y en cada push a main.
#
# Los tests son 737 unitarios con Mockito: no hay @SpringBootTest, ni Testcontainers,
# ni base de datos. Por eso este workflow no necesita servicios y corre en ~3 minutos.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Si se empuja dos veces seguidas a la misma rama, cancela la corrida vieja.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Mínimo privilegio: el workflow solo lee el repo. Cuando se agregue el push a ECR
# ese job necesitará `id-token: write` para OIDC, pero se le da a ese job, no a todos.
permissions:
  contents: read

env:
  # -ntp = sin logs de descarga de dependencias, que son el 80% del ruido del build.
  # No se llama MAVEN_ARGS porque Maven 3.9+ lee esa variable del entorno por su
  # cuenta, y al pasarla además explícita los flags saldrían duplicados.
  MVN_FLAGS: -B -ntp

jobs:
  build-test:
    name: Build y tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Cachea ~/.m2/repository con la clave derivada del pom.xml.
          cache: maven

      # `verify` = compilar + surefire (unitarios) + failsafe (ITs) + repackage del jar.
      # Se usa en vez de `test` para que el empaquetado de Spring Boot también quede
      # validado acá y no explote recién al construir la imagen.
      - name: Compilar y correr tests
        run: ./mvnw $MVN_FLAGS verify

      # `always()` para que los reportes suban también cuando los tests fallan,
      # que es justo cuando hacen falta.
      - name: Subir reportes de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Subir el jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 7

  pmd:
    name: PMD (código muerto)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Puerta bloqueante desde 2026-09-02: las violaciones llegaron a cero. Los dos
    # falsos positivos conocidos (callbacks de JPA y constructores compactos de
    # record) están suprimidos en pmd-ruleset.xml, no aquí.

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Hay que compilar ANTES y en una invocación SEPARADA. PMD 7 necesita el
      # auxclasspath (target/classes) para resolver tipos; sin él, UnusedPrivateMethod
      # no ve quién llama a un método vía interfaz o lambda y lo reporta como muerto.
      # Este job tiene checkout propio, así que no hereda el target/ de build-test.
      #
      # Medido sobre este repo, mismo código:
      #   ./mvnw pmd:check                 -> 22 violaciones (15 son falsos positivos)
      #   ./mvnw compile pmd:check         -> 47 (peor: el classpath se resuelve antes
      #                                        de que compile lo llene)
      #   ./mvnw compile && ./mvnw pmd:check -> 7 (las reales)
      - name: Compilar (PMD necesita el auxclasspath)
        run: ./mvnw $MVN_FLAGS compile

      - name: Analizar con PMD
        run: ./mvnw $MVN_FLAGS pmd:check

      - name: Subir reporte de PMD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-report
          path: target/pmd.xml
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Construir imagen
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Solo en main: el `mvn package` dentro del Dockerfile duplica el trabajo del job
    # de arriba, así que no vale la pena pagarlo en cada push de un PR.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build-test

    steps:
      - uses: actions/checkout@v4

      # Valida que el Dockerfile siga construyendo. Todavía no publica a ningún
      # registry: eso se agrega cuando exista la cuenta de AWS y el repositorio ECR
      # (ver el workflow release.yml comentado abajo en el README de despliegue).
      - name: Construir la imagen
        run: docker build -t verygana-api:${{ github.sha }} .

  observabilidad:
    name: Config de monitoreo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Puerta desde el primer día: un typo en alert.rules.yml no rompe la
    # compilación ni ningún test. Se descubre cuando Prometheus reinicia y no
    # levanta — o peor, cuando la alerta que debía avisar que el dinero no salió
    # simplemente nunca existió. Son 30 segundos de CI.

    steps:
      - uses: actions/checkout@v4

      # promtool valida la config, que los rule_files existan, que cada expr sea
      # PromQL válido y que las plantillas Go de summary/description compilen.
      - name: promtool check config + rules
        run: |
          docker run --rm \
            -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v2.55.1 \
            check config /etc/prometheus/prometheus.yml

      # Parseo del config de Alloy (producción). No evalúa sys.env, solo sintaxis.
      - name: Validar la config de Grafana Alloy
        run: |
          docker run --rm \
            -v "$PWD/monitoring/alloy:/etc/alloy:ro" \
            --entrypoint alloy grafana/alloy:v1.19.2 \
            fmt /etc/alloy/config.alloy > /dev/null

      # Un dashboard con JSON inválido no lo carga el provisioner y falla en
      # silencio: el panel simplemente no aparece.
      - name: Validar los dashboards de Grafana
        run: |
          for f in monitoring/grafana/dashboards/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" \
              || { echo "JSON inválido: $f"; exit 1; }
          done
