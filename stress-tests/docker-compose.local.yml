# Fase local de la prueba de carga: MySQL "como DO" y, sobre el compose base
# de simuladores, la API, k6 y tools. Todo en lt-internal, sin salida a Internet.
# Uso: docker compose -f docker-compose.yml -f docker-compose.local.yml --env-file local/plans/<plan>.env ...
# Las contraseñas son locales y ficticias; no hay secretos reales aquí.
name: verygana-loadtest

services:
  mysql:
    image: mysql:8.0
    platform: linux/arm64/v8
    cpus: ${MYSQL_CPUS}
    mem_limit: ${MYSQL_MEM}
    environment:
      MYSQL_ROOT_PASSWORD: lt-root-local
      MYSQL_DATABASE: verygana
      LT_APP_PASSWORD: lt-app-local
      LT_MONITOR_PASSWORD: lt-monitor-local
    # Las variables que cambian por plan o por variante van por línea de comando
    # (un .cnf no expande variables de entorno). El resto está en do-like.cnf.
    command:
      - --sql-require-primary-key=${MYSQL_REQUIRE_PK:-ON}
      - --log-bin-trust-function-creators=${MYSQL_TRUST_FUNCTION_CREATORS:-OFF}
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL}
      - --max-connections=${MYSQL_MAX_CONNECTIONS}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./local/mysql/do-like.cnf:/etc/mysql/conf.d/do-like.cnf:ro
      - ./local/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - lt-internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -plt-root-local --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Los simuladores del compose base solo viven en la red interna en local.
  wiremock:
    networks: [lt-internal]

  minio:
    networks: [lt-internal]

  minio-init:
    networks: [lt-internal]

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    cpus: ${API_CPUS}
    mem_limit: ${API_MEM}
    # Solo el env de la prueba: nunca el .env de la raiz ni secretos de Infisical.
    env_file: env/loadtest.local.env
    # Claves del JWT: la imagen no lleva certs/private.pem (D-21). Las genera lt.sh en
    # env/keys/ (ignorada por git) y se montan de solo lectura; RsaKeyProperties acepta `file:/ruta`.
    volumes:
      - ./env/keys:/run/lt-keys:ro
    environment:
      RSA_PRIVATEKEY: file:/run/lt-keys/private.pem
      RSA_PUBLICKEY: file:/run/lt-keys/public.pem
      JAVA_OPTS: -XX:MaxRAMPercentage=70
      DB_POOL_SIZE: ${DB_POOL_SIZE}
      SERVER_TOMCAT_THREADS_MAX: ${TOMCAT_THREADS_MAX:-200}
    depends_on:
      mysql:
        condition: service_healthy
      wiremock:
        condition: service_started
      minio:
        condition: service_healthy
    # Sin puertos publicados: los scripts entran por `exec tools` / `run k6`.
    networks: [lt-internal]

  k6:
    image: grafana/k6:1.3.0
    cpus: ${K6_CPUS}
    mem_limit: ${K6_MEM}
    volumes:
      - ./k6:/scripts:ro
      - ./inventory:/inventory:ro
      - ./results:/results
    working_dir: /scripts
    # `run --rm k6 <args>`; sin args solo imprime la version.
    entrypoint: ["k6"]
    command: ["version"]
    networks: [lt-internal]
    profiles: [tools]

  # Cliente HTTP para los scripts que hablan con la API desde dentro de la red.
  tools:
    image: curlimages/curl:latest
    entrypoint: ["sleep", "infinity"]
    networks: [lt-internal]

volumes:
  mysql-data:

networks:
  # Sin ruta a Internet: nada de la prueba puede salir a terceros reales.
  lt-internal:
    internal: true
