spring:
  application:
    name: VerYGanaAPI

  mvc:
    async:
      request-timeout: 330000  # 5.5 min — mayor que el SseEmitter timeout (5 min)

  profiles:
    active: dev

  config:
    import: optional:file:.env[.properties]

# ============================================
# OBSERVABILIDAD — Actuator + Micrometer/Prometheus
# ============================================
management:
  endpoints:
    web:
      exposure:
        # Deliberadamente corto. 'env', 'configprops' y 'beans' filtran configuración
        # (claves de Wompi, ZapSign, Twilio) y no se exponen ni con token.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # /actuator/health es público (lo consulta la plataforma): sin detalles de BD ni disco.
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        scheduled.job.duration: true
      slo:
        # Buckets pensados para jobs: desde el cleanup de segundos hasta el ciclo de payouts.
        scheduled.job.duration: 1s,10s,30s,1m,5m,15m,30m

observability:
  # Token que debe presentar Prometheus (Authorization: Bearer <token>).
  # Vacío => /actuator/prometheus responde 401. Ver ActuatorSecurityConfig.
  scrape-token: ${METRICS_SCRAPE_TOKEN:}

# ============================================
# reCAPTCHA
# ============================================
recaptcha:
  secret-key: ${RECAPTCHA_SECRET_KEY:}
  min-score: 0.5
  login-action: login
  register-consumer-action: register_consumer
  register-commercial-action: register_commercial

# ============================================
# PQRS - Plazos legales por tipo (días hábiles, Ley 1755 de 2015)
# ============================================
pqrs:
  sla-days:
    PETICION: 15
    QUEJA: 15
    RECLAMO: 15
    SUGERENCIA: 10

