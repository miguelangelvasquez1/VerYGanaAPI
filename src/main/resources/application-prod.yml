spring:
  application:
    name: VerYGanaAPI
  config:
    import: optional:file:.env[.properties]

  # =====================
  # DATABASE CONFIGURATION
  # =====================
  datasource:
    # Para Docker
    # url: jdbc:mysql://host.docker.internal:3306/verygana
    # url: jdbc:postgresql://dpg-d66gfsmsb7us73f305j0-a.oregon-postgres.render.com:5432/verygana_eyf3
    # username: root
    # password: aig7UVXXEQlZl0ULkbZCpLHq6oLxS4TS

    # Para Railway (PostgreSQL) - usa variables de entorno
    url: ${DB_URL:jdbc:mysql://localhost:3306/verygana?useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    # driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:40}
      minimum-idle: 10
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 900000
      pool-name: HikariProd

  # =====================
  # JPA/HIBERNATE CONFIGURATION
  # =====================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  # =====================
  # MULTIPART/FILE UPLOAD
  # =====================
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
      file-size-threshold: 2MB
      # max-file-count: 20

# ============================================
# JWT CONFIGURATION
# ============================================
rsa:
  private-key: classpath:certs/private.pem
  public-key: classpath:certs/public.pem

commissions:
  ad-commission: 0.1
  

jwt:
  access-token:
    expiration: 900        # 15 min (in seconds) — corto a propósito: es un JWT stateless sin
                            # chequeo de revocación por request, así que su vida útil es la
                            # ventana de exposición si se filtra. La sesión larga la maneja el refresh token.
  refresh-token:
    expiration: 604800     # 7 days (in seconds)

# ============================================
# STORAGE CONFIGURATION
# ============================================
storage:
  provider: cloudinary  # Options: cloudinary, r2

# =====================
# CLOUDINARY (Development)
# =====================
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

# =====================
# CLOUDFLARE R2 (Production - Future)
# =====================
cloudflare:
  r2:
    account-id: ${R2_ACCOUNT_ID:your-account-id}
    access-key-id: ${R2_ACCESS_KEY_ID}
    secret-access-key: ${R2_SECRET_ACCESS_KEY}
    bucket-name: ${R2_BUCKET_NAME:verygana-campaigns}
    cdn-domain: ${R2_CDN_DOMAIN:} # Opcional: cdn.verygana.com
    games-worker-domain: ${R2_GAMES_WORKER_DOMAIN:games.verygana.com}
    endpoint: ${R2_ENDPOINT:} # Opcional, se construye automáticamente
    pets-bucket-name: ${R2_PETS_BUCKET_NAME:verygana-pets}
    pets-cdn-domain: ${R2_PETS_CDN_DOMAIN:}

# Configuración de limpieza de huérfanos
cleanup:
  orphaned-assets:
    enabled: true
    cron: "0 0 2 * * ?" # Cada día a las 2 AM
    max-age-hours: 24 # Eliminar huérfanos de más de 24 horas

# ============================================
# CACHE CONFIGURATION
# ============================================
spring.cache:
  type: caffeine
  caffeine:
    spec: maximumSize=500,expireAfterWrite=24h
  cache-names:
    - availableAdsCount
    - userPreferences
    - categories
    - departments
    - municipalities

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging:
  level:
    root: INFO
    com.verygana2: DEBUG
    com.verygana2.repositories: DEBUG
    com.verygana2.services: DEBUG
    com.verygana2.services.storage: DEBUG
    #org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security: DEBUG

# ============================================
# Email service
# ============================================   
sendgrid:
  api-key: ${SENDGRID_API_KEY}
  from-email: notificaciones@verygana.com
  from-name: VerYGana
  support-email: soporte@verygana.com
  logo-url: ${EMAIL_LOGO_URL:https://verygana.com/assets/logo-email.png}
# ============================================
# TAXES
# ============================================      
taxes:
  iva: ${IVA}
# ============================================
# PLATFORM EARNINGS
# ============================================ 
platformEarnings:
  product-commission : ${PRODUCT_SALE_COMMISSION}
# ============================================
# USERS EARNINGS
# ============================================  
usersEarnings:
  ad-view: ${AD_VIEW}

# ============================================
# GAMES CONFIG
# ============================================ 
games:
  cdn-url: ${GAMES_CDN_URL}
  user-hash-secret: ${USER_HASH_SECRET}
  session-expiration-minutes: 30


pets:
  cdn-domain: ${R2_PETS_CDN_DOMAIN}
  # Si se define, los assets se sirven desde acá en vez de desde el dominio de R2.
  # En desarrollo: http://localhost:3000/pet-assets (el proxy del front), que evita
  # el bloqueo por CORS al pedirlos con fetch desde el juego.
  asset-base-url: ${PETS_ASSET_BASE_URL:}
  game-path: ${PETS_GAME_PATH:index.html}
  # Imagen del producto que el comercial adjunta al pedir integración al catálogo.
  # Se sube al bucket de mascotas (cloudflare.r2.pets-bucket-name).
  catalog-request-image:
    max-size-bytes: ${PETS_CATALOG_REQUEST_IMAGE_MAX_BYTES:5242880} # 5 MB

  # Sistema de coordenadas del área de juego, para el lienzo del editor de escenas.
  # Verificado contra el juego el 2026-08-17 (CanvasScaler del build + comparación
  # con la previsualización real). Se corrige por variable de entorno si cambia.
  scene-canvas:
    width: ${PETS_SCENE_CANVAS_WIDTH:1920}
    height: ${PETS_SCENE_CANVAS_HEIGHT:1080}
    y-axis: ${PETS_SCENE_CANVAS_Y_AXIS:UP}        # DOWN = 0 arriba | UP = 0 abajo
    anchor: ${PETS_SCENE_CANVAS_ANCHOR:CENTER}    # TOP_LEFT | CENTER


app:
  base-url: ${APP_BASE_URL}
  frontend:
    base-url: ${FRONTEND_BASE_URL}
  claim-code:
    encryption-key: ${APP_CLAIM_CODE_ENCRYPTION_KEY}
  product-code:
    encryption-key: ${APP_PRODUCT_CODE_ENCRYPTION_KEY}
    hmac-secret: ${APP_PRODUCT_CODE_HMAC_SECRET}

payment:
  min-deposit: 5000      # $5.000 COP
  max-deposit: 10000000  # $10.000.000 COP

commercial:
  contract:
    # Límite de generación de contratos de RECHARGE/PLAN_CHANGE por comercial: cada
    # generación puede disparar un envío real a firma electrónica (con costo con el
    # proveedor), así que se acota cuántos se pueden generar por ventana.
    rate-limit:
      max-per-window: 1
      window-hours: 24
  page-visit:
    # Ventana de deduplicación por (anuncio, consumer) al registrar visitas a la
    # página oficial del empresario ("Remisión"): un clic repetido dentro de este
    # lapso no genera una fila nueva. Evita inflar la métrica por doble clic / reintentos.
    dedup-window-minutes: 30

purchase:
  expiry:
    max-age-minutes: 40   # checkout Wompi expira en ~30 min; 40 da margen para el webhook
  cleanup:
    interval-ms: 300000   # cada 5 minutos en producción

# ============================================
# PRIZE EXPIRY
# ============================================
prize:
  expiry:
    cron: "0 0/30 * * * *"  # cada 30 minutos

# ============================================
# PRODUCT CLEANUP (REJECTED / INACTIVE)
# ============================================
marketplace:
  product:
    cleanup:
      cron: "0 30 3 * * SUN"   # domingos 3:30 AM
      grace-period-days: 30    # dias en REJECTED/INACTIVE antes de purgar


# ============================================
# AUDIT CONFIG
# ============================================ 
audit:
  # Habilitar/deshabilitar auditoría
  enabled: true
  
  # Nivel mínimo para persistir (útil en dev)
  # DEBUG: solo para debugging local
  # INFO: operaciones normales
  # WARNING: operaciones sospechosas
  # CRITICAL: operaciones críticas
  min-level: INFO
  
  # Configuración de retención (días)
  retention:
    debug: 7
    info: 90
    warning: 365
    critical: 2555  # 7 años
  
  # Limpieza automática
  cleanup:
    enabled: true
    cron: "0 0 3 * * ?"  # 3 AM diario
    
  # Reportes
  reports:
    weekly:
      enabled: true
      cron: "0 0 8 * * MON"  # Lunes 8 AM
      recipients:
        - admin@verygana.com
        
  # Máscaras por defecto (además de las especificadas en @Auditable)
  default-mask-params:
    - password
    - confirmPassword
    - oldPassword
    - token
    - apiKey
    - secret
    - creditCard
    - ssn
    
  # Excluir de auditoría (no auditar aunque tenga @Auditable)
  excluded-actions:
    - HEALTH_CHECK
    - METRICS_COLLECTION
    
  # Configuración de async
  async:
    core-pool-size: 2
    max-pool-size: 10
    queue-capacity: 500
    thread-name-prefix: "audit-"

  # Sorteos con API externa (Random.org)
randomOrg:
    api-url: https://api.random.org/json-rpc/4/invoke
    api-key: ${RANDOM_ORG_API_KEY:your-random-org-api-key}
    timeout: 30000 # 30 segundoswompi:

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID}
  auth-token: ${TWILIO_AUTH_TOKEN}
  verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID}
  phone-number: ${TWILIO_PHONE_NUMBER}

wompi:
  public-key: ${WOMPI_PUBLIC_KEY}
  private-key: ${WOMPI_PRIVATE_KEY}
  integrity-secret: ${WOMPI_INTEGRITY_SECRET}
  events-key: ${WOMPI_EVENTS_KEY}
  checkout-base-url: https://checkout.wompi.co/p/
  api-base-url: https://production.wompi.co/v1
  payout:
    api-key: ${WOMPI_PAYOUT_API_KEY}
    principal-user-id: ${WOMPI_PAYOUT_PRINCIPAL_USER_ID}
    events-key: ${WOMPI_PAYOUT_EVENTS_KEY}
    account-id: ${WOMPI_PAYOUT_ACCOUNT_ID}
    nequi-bank-id: ${WOMPI_PAYOUT_NEQUI_BANK_ID}
    daviplata-bank-id: ${WOMPI_PAYOUT_DAVIPLATA_BANK_ID}
    api-base-url: https://api.payouts.wompi.co/v1
    cron: "0 0 4 * * *"
    retry-cron: "0 30 4 * * *"
    min-balance-alert-cents: 5000000

zapsign:
  api-token: ${ZAPSIGN_API_TOKEN:}
  # false => usa https://api.zapsign.com.br (URL derivada en ZapSignWebClientConfig).
  # ZAPSIGN_API_TOKEN debe ser el token de PRODUCCIÓN de ZapSign, no el de sandbox.
  sandbox: false
  default-auth-mode: assinaturaTela
  default-phone-country-code: "57"
  signer-custom-message: "VERYGANA te invita a firmar electrónicamente el Contrato Marco de Vinculación Comercial."
  lang: es
  brand-logo: ${EMAIL_LOGO_URL:https://cdn.verygana.com/public/logos/logoDorado.png}
  brand-name: ${ZAPSIGN_BRAND_NAME:VERyGANA}
  require-selfie-validation: ${ZAPSIGN_REQUIRE_SELFIE_VALIDATION:false}
  selfie-validation-type: liveness-document-match
  background-check-country: CO
  webhook-header-name: X-VeryGana-Secret
  webhook-secret: ${ZAPSIGN_WEBHOOK_SECRET:}

  # ============================================
  # reCAPTCHA
  # ============================================
  recaptcha:
    secret-key: ${RECAPTCHA_SECRET_KEY:}
    min-score: 0.5
    login-action: login

# ============================================
# AVISOS DE SALDO BAJO / DORMANT WALLETS
# ============================================
budget:
    # % del último depósito por debajo del cual se avisa "saldo bajo" (WARNING) y se muestra la alerta en el dashboard.
    low-balance-warning-pct: 20
    # % del último depósito por debajo del cual el aviso escala a "crítico" (CRITICAL). 0 = sin escalón crítico.
    low-balance-critical-pct: 5
    # Días que un wallet puede permanecer en saldo 0 antes de pasar a DORMANT (bloqueo de edición).
    grace-period-days: 15
    # Barrido periódico de wallets financiados (ACTIVE / EXHAUSTED). Cron de 6 campos, zona UTC.
    alert-cron: "0 0 * * * *"